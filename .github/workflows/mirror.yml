name: Mirror to GitLab

on:
  push:
  delete:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitLab
        env:
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          # Encode credentials to safely bypass special character URL parsing bugs
          AUTH_HEADER=$(echo -n "HuttonWilliam:$GL_TOKEN" | base64 | tr -d '\n')
          
          # Configure git to use the auth header specifically for gitlab.com
          git config --global http.https://gitlab.com/.extraheader "Authorization: Basic $AUTH_HEADER"
          
          # Add the clean repository link and push everything across
          git remote add gitlab https://gitlab.com/HuttonWilliam/lubuntu-system-tools.git
          git push --prune gitlab "+refs/remotes/origin/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
